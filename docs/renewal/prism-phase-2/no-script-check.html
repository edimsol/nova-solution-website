<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOVA 실제 페이지 · JavaScript 없는 화면 검토</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; color: #eef0f4; background: #17191e; font: 15px/1.5 system-ui, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 16px; color: #b9c2cd; }
    .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
    select, button { min-height: 42px; padding: 8px 12px; border: 1px solid #77818f; border-radius: 6px; color: #eef0f4; background: #242932; font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid #70d6e8; outline-offset: 3px; }
    iframe { display: block; width: 100%; height: 1000px; border: 1px solid #58616c; background: #fff; }
  </style>
</head>
<body>
  <h1>실제 페이지 · JavaScript 없는 화면 검토</h1>
  <p>아래 프레임은 저장소의 실제 페이지를 직접 엽니다. 프레임 안의 스크립트 실행과 폼 제출은 차단됩니다.</p>
  <div class="controls">
    <label for="page">검토할 페이지</label>
    <select id="page">
      <option value="index.html">Home</option>
      <option value="company.html">Company</option>
      <option value="solutions.html">Solutions</option>
      <option value="hvac.html">HVAC</option>
      <option value="ventilation.html">Ventilation</option>
      <option value="air-system.html">Air System</option>
      <option value="parts-control.html">Parts &amp; Control</option>
      <option value="edim.html">EDIM</option>
      <option value="technology.html">Technology</option>
      <option value="resources.html">Resources</option>
      <option value="contact.html">Contact</option>
    </select>
    <button id="reload" type="button">페이지 다시 열기</button>
    <span id="status" role="status">index.html</span>
  </div>
  <iframe id="preview" title="Home · JavaScript와 폼 제출이 차단된 실제 페이지" src="../../../index.html" sandbox="allow-same-origin" width="100%" height="1000"></iframe>
  <script>
    (() => {
      const select = document.getElementById('page');
      const preview = document.getElementById('preview');
      const requested = new URLSearchParams(location.search).get('page');
      if ([...select.options].some(option => option.value === requested)) select.value = requested;
      const show = () => {
        preview.src = `../../../${select.value}`;
        preview.title = `${select.selectedOptions[0].textContent} · JavaScript와 폼 제출이 차단된 실제 페이지`;
        document.getElementById('status').textContent = select.value;
      };
      select.addEventListener('change', show);
      document.getElementById('reload').addEventListener('click', show);
      if (requested) show();
    })();
  </script>
</body>
</html>
